<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src https://lyvisiuknkumqrxihqnb.supabase.co; img-src 'none'; media-src 'none'; font-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; worker-src 'none'">
  <title>CardHQ capture</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <main>
    <h1>Send card photos</h1>
    <p>This link expires shortly and works once. Place the card flat in even light, avoid glare, and fill the frame.</p>
    <form id="capture-form">
      <fieldset>
        <legend>Front</legend>
        <div class="source-options">
          <label class="source-option">Take Photo
            <input data-image-input data-side="front" data-source="camera" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif" capture="environment">
          </label>
          <label class="source-option">Choose Existing Photo
            <input data-image-input data-side="front" data-source="library" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif">
          </label>
        </div>
        <p class="selection" data-selection-for="front">No front photo selected.</p>
      </fieldset>
      <fieldset>
        <legend>Back</legend>
        <div class="source-options">
          <label class="source-option">Take Photo
            <input data-image-input data-side="back" data-source="camera" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif" capture="environment">
          </label>
          <label class="source-option">Choose Existing Photo
            <input data-image-input data-side="back" data-source="library" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif">
          </label>
        </div>
        <p class="selection" data-selection-for="back">No back photo selected.</p>
      </fieldset>
      <button type="submit" disabled>Send securely</button>
      <p id="status" role="status" aria-live="polite"></p>
    </form>
  </main>
</body>
</html>
